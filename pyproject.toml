[project]
name = "resume-tailor"
version = "0.1.0"
description = "Surgical, human-reviewable resume tailoring from a job description."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.0", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resume_tailor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
